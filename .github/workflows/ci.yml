name: Odoo Module Integration Testing

on:
  push:
    branches: [ main, master, "19.0" ] # 👈 Add your Odoo version branch here
  pull_request:
    branches: [ main, master, "19.0" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 👇 Spins up a lightweight Postgres service alongside the runner
    services:
      db:
        image: docker.io/library/postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo19
          POSTGRES_PASSWORD: Admin@123
        ports:
          - 5432:5432
        # Wait until postgres is healthy before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Download your code from GitHub into the runner workspace
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. Build the Podman container using your project's Containerfile/Dockerfile
      - name: Build Odoo Image
        run: |
          docker build -t odoo-ci-runner:latest -f Dockerfile .

      # 3. Execute an automated sanity test using Odoo's internal compiler
      - name: Run Odoo Module Integration Test
        run: |
          docker run --rm \
            --network=host \
            odoo-ci-runner:latest \
            python3 odoo-bin -d postgres --db_host=127.0.0.1 --db_port=5432 -i repair_clinics --stop-after-init